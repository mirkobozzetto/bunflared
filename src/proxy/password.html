<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password needed</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 17px/1.4 system-ui, -apple-system, sans-serif;
         background: #f6f4ef; color: #1d1d1f; }
  form { width: min(22rem, calc(100vw - 2rem)); display: grid; gap: .8rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: #6b6b70; }
  input, button { font: inherit; padding: .8rem 1rem; border-radius: .7rem; }
  input { border: 1px solid #c9c6bf; background: #fff; color: inherit; }
  button { border: 0; background: #e8590c; color: #fff; font-weight: 600; }
  .error { color: #c92a2a; }
  .error:empty { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ececec; }
    p { color: #9a9aa0; }
    input { background: #1f1f1f; border-color: #3a3a3a; }
  }
</style>
</head>
<body>
<form method="post" action="/_bunflared/password">
  <h1>This link has a password</h1>
  <p>Ask the person who sent it.</p>
  <input type="password" name="password" autocomplete="current-password"
         autocapitalize="off" autocorrect="off" spellcheck="false"
         aria-label="Password" placeholder="Password" required autofocus>
  <input type="hidden" name="next" value="{next}">
  <p class="error" role="alert">{error}</p>
  <button type="submit">Open</button>
</form>
</body>
</html>
