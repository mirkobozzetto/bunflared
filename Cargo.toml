[package]
name = "bunflared"
version = "0.2.1"
edition = "2024"
description = "One command, one throwaway link for your localhost, several ports behind it. Chat with your client from the terminal, send them to a page, follow their cursor, catch their reactions 🔥"
license = "MIT"
repository = "https://github.com/mirkobozzetto/bunflared"
readme = "README.md"
keywords = ["tunnel", "localhost", "cloudflare", "share", "tui"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
qrcode = "0.14.1"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
