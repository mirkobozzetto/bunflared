[package]
name = "bunflared"
version = "0.1.1"
edition = "2024"
description = "Share localhost on a public link, with an absurdly fun terminal show and an agent mode"
license = "MIT"
repository = "https://github.com/mirkobozzetto/bunflared"
readme = "README.md"
keywords = ["tunnel", "localhost", "cloudflare", "share", "tui"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
qrcode = "0.14.1"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
